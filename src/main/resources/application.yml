spring:
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url : jdbc:mysql://localhost:3306/social
    username: root
    password: ${DB_PW}

  jwt:
    secret: vmfhaltmskdlstkfkdgodyroqkfwkdbalroqkfwkdbalaaaaaaaaaaaaaaaabbbbb

  jpa:
    database: mysql
    #defer-datasource-initialization: true #JPA 테이블 생성 이후 data.sql
    hibernate:
      #  ddl-auto: update #테이블은 없는데 entity가 존재하면 create한다.
      ddl-auto: create #프로젝트 실행시마다 테이블을 모두 drop 후 create한다.

  security:
    oauth2:
      client:
        #provider | 서비스별로 정해진 값이 존재
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

        # registration | 외부 서비스에서 우리를 특정하기 위한 정보
        registration:
          naver:
            client-name: Naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_PW}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            # redirect-uri의 {baseUrl}, {action}, {registrationId}은
            # Spring Security가 제공하는 URI 템플릿 변수
            scope:
              - name
              - email
          google:
            client-name: Google
            client-id: ${GOOGLE_CLIENT_ID}
            # authorization-grant-type: authorization_code # 구글은 생략가능(CommonOAuth2Provider가 채워줌)
            # redirect-uri: "http://localhost:8080/login/oauth2/code/naver" #구글은 생략가능(CommonOAuth2Provider가 채워줌)
            scope:
              - profile
              - email


